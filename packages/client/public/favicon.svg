<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 硃砂印章：宣紙底 + 紅章「帳」（手刻缺角以 path 微傾表現） -->
  <rect width="64" height="64" rx="10" fill="#e7dcc3"/>
  <g transform="rotate(-4 32 32)">
    <rect x="10" y="10" width="44" height="44" rx="5" fill="#a8321f"/>
    <rect x="14.5" y="14.5" width="35" height="35" rx="3" fill="none" stroke="#f3d9a0" stroke-width="2"/>
    <text x="32" y="43" text-anchor="middle" font-family="'Noto Serif TC','Songti TC',serif" font-size="28" font-weight="900" fill="#f6ecd8">帳</text>
  </g>
</svg>
